name: Metro2 Uruchye and Borisovsky station finishing V56
on:
  push:
    branches: [feature/metro2-stations-detail-v56]
    paths:
      - '.github/workflows/metro2-stations-detail-v56.yml'
      - 'metro2/scripts/station/uruchye_architecture.gd'
      - 'metro2/modules/stations/borisovsky_trakt/borisovsky_trakt.gd'
      - 'metro2/tools/stations_v56/**'
permissions:
  contents: write
concurrency:
  group: metro2-permanent-viewer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare current station assets
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin gh-pages
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/stations-v56-pages-base"
          python3 metro2/tools/stations_v56/publish.py prepare stations-v56 "$(cat "$RUNNER_TEMP/stations-v56-pages-base")"
      - name: Mandatory Godot resource import and station Web packs export
        shell: bash
        run: |
          set -euo pipefail
          python3 metro2/tools/stations_v56/publish.py build stations-v56
          python3 metro2/tools/stations_v56/publish.py finish stations-v56
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stations-v56-${{ github.sha }}
          path: stations-v56/
          retention-days: 7
      - name: Publish two stations only to permanent viewer
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/stations-v56-pages" "$(cat "$RUNNER_TEMP/stations-v56-pages-base")"
          cp -a stations-v56/web/. "$RUNNER_TEMP/stations-v56-pages/metro2/module-viewer/"
          cd "$RUNNER_TEMP/stations-v56-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- metro2/module-viewer
          git commit -m 'Detail Uruchye and Borisovsky finishes; preserve other viewer modules'
          git push origin HEAD:gh-pages
