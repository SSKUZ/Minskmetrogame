name: Metro2 Uruchye six owner corrections V68
on:
  push:
    branches: [feature/metro2-uruchye-six-fixes-v68]
    paths:
      - '.github/workflows/metro2-uruchye-six-v68.yml'
      - 'metro2/scripts/station/uruchye_architecture.gd'
      - 'metro2/assets/station/uruchye_v68/**'
      - 'metro2/scripts/station/uruchye_tracks_v68.gd'
      - 'metro2/tools/uruchye_six_v68/**'
permissions:
  contents: write
concurrency:
  group: metro2-permanent-viewer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current viewer and export only Uruchye
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin gh-pages
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/uruchye-six-v68-pages-base"
          python3 metro2/tools/uruchye_six_v68/publish.py prepare uruchye-six-v68 "$(cat "$RUNNER_TEMP/uruchye-six-v68-pages-base")"
      - name: Mandatory Godot resource import and station Web packs export
        shell: bash
        run: |
          set -euo pipefail
          python3 metro2/tools/uruchye_six_v68/publish.py build uruchye-six-v68
          python3 metro2/tools/uruchye_six_v68/publish.py finish uruchye-six-v68
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uruchye-six-v68-${{ github.sha }}
          path: uruchye-six-v68/
          retention-days: 7
      - name: Publish updated Uruchye to permanent viewer
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/uruchye-six-v68-pages" "$(cat "$RUNNER_TEMP/uruchye-six-v68-pages-base")"
          cp -a uruchye-six-v68/web/. "$RUNNER_TEMP/uruchye-six-v68-pages/metro2/module-viewer/"
          cd "$RUNNER_TEMP/uruchye-six-v68-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- metro2/module-viewer
          git commit -m 'Update Uruchye arrival map, upper exits, enclosed stairs, detailed rails, clear service door and raised bilingual names'
          git push origin HEAD:gh-pages
