name: Validate game branches
on:
  push:
    branches: [develop, testing]
  pull_request:
    branches: [main, develop, testing]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Verify game entrypoints
        run: |
          test -f index.html
          test -f js/main.js
          test -f js/cameras/CarriageCamera.js
          test -f js/train/TrainPhysics.js
          test -f js/passengers/PassengerMotion.js
          test -f js/passengers/PassengerModels.js
          test -f js/passengers/PassengerMovement.js
          test -f js/passengers/PassengerBoarding.js
          test -f js/passengers/PassengerCount.js
          test -f js/platforms/PlatformGeometry.js
          test -f js/graphics/Geometry.js
          test -f js/graphics/Materials.js
          test -f js/world/TrackProfile.js
          test -f js/cab/CabButtons.js
          test -f js/cab/CabDisplay.js
          test -f js/carriage/CarriageInterior.js
          test -f js/carriage/CarriageMaterials.js
          test -f js/carriage/CarriageShell.js
          test -f js/carriage/CarriageWindows.js
          test -f js/carriage/CarriageSeats.js
          test -f js/carriage/CarriageRails.js
          test -f js/carriage/CarriageLighting.js
          test -f js/carriage/CarriageInformation.js
          test -f js/carriage/CarriageDoors.js
      - name: Unit test isolated modules
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {smoothstep01,trackDrop} from './js/world/TrackProfile.js';
          import {animateCabButtons} from './js/cab/CabButtons.js';
          assert.equal(smoothstep01(-2),0);
          assert.equal(smoothstep01(0),0);
          assert.equal(smoothstep01(.5),.5);
          assert.equal(smoothstep01(1),1);
          assert.equal(smoothstep01(2),1);
          assert.equal(trackDrop(50,8,0,100),4);
          const b={press:0,target:1,cap:{position:{},material:{emissive:{setHex(x){this.value=x}}}},face:{position:{}}};
          animateCabButtons([b],1);
          assert.equal(b.press,1);
          assert.equal(b.cap.position.y,.07);
          assert.equal(b.cap.material.emissive.value,0x112c28);
          // Extracted passenger and platform module smoke tests.
          const {recordBoarding}=await import('./js/passengers/PassengerCount.js');
          const {easePassengerMotion}=await import('./js/passengers/PassengerBoarding.js');
          const {buildPlatformApproach}=await import('./js/platforms/PlatformGeometry.js');
          const {buildCarriageWindows}=await import('./js/carriage/CarriageWindows.js');
          const recorded=new Set(), cp={settled:false};let people=0;
          assert.equal(recordBoarding(recorded,4,cp,()=>people++),true);
          assert.equal(recordBoarding(recorded,4,cp,()=>people++),false);
          assert.equal(people,1);assert.equal(cp.settled,true);
          assert.equal(easePassengerMotion(.5),.5);
          const objects=[];const box=(...args)=>objects.push(args);
          buildPlatformApproach({platform:{},box,approachRailBed:1,rail:2,wood:3});
          assert.ok(objects.length>20);
          const before=objects.length;
          buildCarriageWindows({carriage:{},box,side:-1,z:-3,carBlack:4,carGlass:5});
          assert.equal(objects.length-before,5);
          // Regression: advancing stations must not clear settled passengers.
          const fs=await import('node:fs');
          const mainSource=fs.readFileSync('./js/main.js','utf8');
          assert.ok(mainSource.includes('cp.person.visible=cp.settled'));
          assert.ok(!mainSource.includes('cp.settled=false;cp.person.visible=false'));
          JS
