name: Browser visual smoke (testing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local game server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/metro-server.log 2>&1 &
          echo $! > /tmp/metro-server.pid
      - name: Browser smoke and screenshots
        run: node tests/browser-smoke.mjs
      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-browser-screenshots
          path: |
            test-results/
            /tmp/metro-server.log
          if-no-files-found: warn
          retention-days: 14
