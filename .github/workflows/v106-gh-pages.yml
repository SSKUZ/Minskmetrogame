name: Publish v106 interactive inspector to gh-pages
on:
  push:
    branches: [integration/consist-v106]
    paths:
      - 'preview/**'
      - '.github/workflows/v106-gh-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metro-gh-pages-v106
  cancel-in-progress: false
jobs:
  publish-v106:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration model
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 0
      - name: Install independent v106 viewer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published/v106
          rsync -a --delete --exclude='.git/' source/preview/ published/v106/
          test -s published/v106/wagon.html
          test -s published/v106/assets/goodmix-duo-zakhar.jpg
          touch published/.nojekyll
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v106 .nojekyll
          if git diff --cached --quiet; then
            echo 'v106 is already current'
            exit 0
          fi
          git commit -m "Publish isolated v106 viewer from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
