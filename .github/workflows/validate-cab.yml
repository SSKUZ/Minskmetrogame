name: Validate isolated cab development
on:
  push:
    branches: [cab-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          find js -name '*.js' -type f -print0 | xargs -0 -n1 node --check
          node --check tests/cab-controls.test.js
      - name: Run isolated cab regression tests
        run: node --test tests/cab-controls.test.js
      - name: Run full game regression suite
        run: npm test
      - name: Install browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser smoke test of actual cab
        run: |
          node tests/cab-cold-start.mjs
          CAB_SUITE=desktop node tests/cab-browser.mjs
          CAB_SUITE=mobile node tests/cab-browser.mjs
          CAB_SUITE=launch node tests/cab-browser.mjs
          node tests/cab-visual-compare.mjs
      - name: Upload cab screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cab-browser-screenshots
          path: test-results/cab/
          if-no-files-found: ignore
