name: Validate isolated cab development
on:
  push:
    branches: [cab-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          find js -name '*.js' -type f -print0 | xargs -0 -n1 node --check
          node --check tests/cab-controls.test.js
      - name: Run isolated cab regression tests
        run: node --test tests/cab-controls.test.js
      - name: Run full game regression suite (known baseline failures tracked separately)
        continue-on-error: true
        run: npm test
