name: Metro2 Borisovsky Trakt video refinement V69
on:
  push:
    branches: [feature/metro2-borisovsky-refinement-v69]
    paths:
      - '.github/workflows/metro2-borisovsky-refinement-v69.yml'
      - 'metro2/modules/stations/borisovsky_trakt/**'
      - 'metro2/tools/borisovsky_refine_v69/**'
permissions:
  contents: write
concurrency:
  group: metro2-permanent-viewer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current viewer and export only Borisovsky Trakt
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin gh-pages
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/borisovsky-video-v69-pages-base"
          python3 metro2/tools/borisovsky_refine_v69/publish.py prepare borisovsky-video-v69 "$(cat "$RUNNER_TEMP/borisovsky-video-v69-pages-base")"
      - name: Mandatory Godot resource import and station Web packs export
        shell: bash
        run: |
          set -euo pipefail
          python3 metro2/tools/borisovsky_refine_v69/publish.py build borisovsky-video-v69
          python3 metro2/tools/borisovsky_refine_v69/publish.py finish borisovsky-video-v69
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: borisovsky-video-v69-${{ github.sha }}
          path: borisovsky-video-v69/
          retention-days: 7
      - name: Publish updated Borisovsky Trakt to permanent viewer
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/borisovsky-video-v69-pages" "$(cat "$RUNNER_TEMP/borisovsky-video-v69-pages-base")"
          cp -a borisovsky-video-v69/web/. "$RUNNER_TEMP/borisovsky-video-v69-pages/metro2/module-viewer/"
          cd "$RUNNER_TEMP/borisovsky-video-v69-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- metro2/module-viewer
          git commit -m 'Refine Borisovsky Trakt from owner video and photos: raised names, marble, floor, ceilings, columns and seating'
          git push origin HEAD:gh-pages
