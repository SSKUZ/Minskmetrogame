name: Metro2 Yakuba Kolasa owner-photo reconstruction V64
on:
  push:
    branches: [feature/metro2-yakuba-kolasa-photo-v64]
    paths:
      - '.github/workflows/metro2-yakuba-kolasa-photo-v64.yml'
      - 'metro2/modules/stations/yakuba_kolasa/**'
      - 'metro2/tools/yakuba_kolasa_photo_v64/**'
      - 'metro2/modules/core/module_catalog.gd'
      - 'metro2/viewers/module_viewer.gd'
permissions:
  contents: write
concurrency:
  group: metro2-permanent-viewer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current viewer and export only Yakuba Kolasa
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin gh-pages
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/yakuba-kolasa-photo-v64-pages-base"
          python3 metro2/tools/yakuba_kolasa_photo_v64/publish.py prepare yakuba-kolasa-photo-v64 "$(cat "$RUNNER_TEMP/yakuba-kolasa-photo-v64-pages-base")"
      - name: Mandatory Godot resource import and station Web packs export
        shell: bash
        run: |
          set -euo pipefail
          python3 metro2/tools/yakuba_kolasa_photo_v64/publish.py build yakuba-kolasa-photo-v64
          python3 metro2/tools/yakuba_kolasa_photo_v64/publish.py finish yakuba-kolasa-photo-v64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yakuba-kolasa-photo-v64-${{ github.sha }}
          path: yakuba-kolasa-photo-v64/
          retention-days: 7
      - name: Publish updated Yakuba Kolasa to permanent viewer
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/yakuba-kolasa-photo-v64-pages" "$(cat "$RUNNER_TEMP/yakuba-kolasa-photo-v64-pages-base")"
          cp -a yakuba-kolasa-photo-v64/web/. "$RUNNER_TEMP/yakuba-kolasa-photo-v64-pages/metro2/module-viewer/"
          cd "$RUNNER_TEMP/yakuba-kolasa-photo-v64-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- metro2/module-viewer
          git commit -m 'Reconstruct Yakuba Kolasa from owner photographs; preserve other station packs'
          git push origin HEAD:gh-pages
