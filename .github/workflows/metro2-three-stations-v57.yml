name: Metro2 three new independent stations V57
on:
  push:
    branches: [feature/metro2-three-stations-v57]
    paths:
      - '.github/workflows/metro2-three-stations-v57.yml'
      - 'metro2/modules/stations/vostok/**'
      - 'metro2/modules/stations/moskovskaya/**'
      - 'metro2/modules/stations/park_chelyuskintsev/**'
      - 'metro2/modules/core/module_catalog.gd'
      - 'metro2/viewers/module_viewer.gd'
      - 'metro2/tools/three_stations_v57/**'
permissions:
  contents: write
concurrency:
  group: metro2-permanent-viewer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current viewer and stage new stations
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin gh-pages
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/three-stations-v57-pages-base"
          python3 metro2/tools/three_stations_v57/publish.py prepare three-stations-v57 "$(cat "$RUNNER_TEMP/three-stations-v57-pages-base")"
      - name: Mandatory Godot resource import and station Web packs export
        shell: bash
        run: |
          set -euo pipefail
          python3 metro2/tools/three_stations_v57/publish.py build three-stations-v57
          python3 metro2/tools/three_stations_v57/publish.py finish three-stations-v57
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-stations-v57-${{ github.sha }}
          path: three-stations-v57/
          retention-days: 7
      - name: Publish three new station modules to permanent viewer
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/three-stations-v57-pages" "$(cat "$RUNNER_TEMP/three-stations-v57-pages-base")"
          cp -a three-stations-v57/web/. "$RUNNER_TEMP/three-stations-v57-pages/metro2/module-viewer/"
          cd "$RUNNER_TEMP/three-stations-v57-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- metro2/module-viewer
          git commit -m 'Add Vostok, Moskovskaya and Park Chelyuskintsev; retain existing viewer modules'
          git push origin HEAD:gh-pages
