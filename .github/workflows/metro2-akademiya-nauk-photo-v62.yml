name: Metro2 Akademiya Nauk owner-photo reconstruction V62
on:
  push:
    branches: [feature/metro2-akademiya-nauk-photo-v62]
    paths:
      - '.github/workflows/metro2-akademiya-nauk-photo-v62.yml'
      - 'metro2/modules/stations/akademiya_nauk/**'
      - 'metro2/tools/akademiya_nauk_photo_v62/**'
      - 'metro2/modules/core/module_catalog.gd'
      - 'metro2/viewers/module_viewer.gd'
permissions:
  contents: write
concurrency:
  group: metro2-permanent-viewer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current viewer and export only Akademiya Nauk
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin gh-pages
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/akademiya-nauk-photo-v62-pages-base"
          python3 metro2/tools/akademiya_nauk_photo_v62/publish.py prepare akademiya-nauk-photo-v62 "$(cat "$RUNNER_TEMP/akademiya-nauk-photo-v62-pages-base")"
      - name: Mandatory Godot resource import and station Web packs export
        shell: bash
        run: |
          set -euo pipefail
          python3 metro2/tools/akademiya_nauk_photo_v62/publish.py build akademiya-nauk-photo-v62
          python3 metro2/tools/akademiya_nauk_photo_v62/publish.py finish akademiya-nauk-photo-v62
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akademiya-nauk-photo-v62-${{ github.sha }}
          path: akademiya-nauk-photo-v62/
          retention-days: 7
      - name: Publish updated Akademiya Nauk to permanent viewer
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/akademiya-nauk-photo-v62-pages" "$(cat "$RUNNER_TEMP/akademiya-nauk-photo-v62-pages-base")"
          cp -a akademiya-nauk-photo-v62/web/. "$RUNNER_TEMP/akademiya-nauk-photo-v62-pages/metro2/module-viewer/"
          cd "$RUNNER_TEMP/akademiya-nauk-photo-v62-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- metro2/module-viewer
          git commit -m 'Reconstruct Akademiya Nauk from owner photographs; preserve other station packs'
          git push origin HEAD:gh-pages
