name: Metro 2.0 - Web Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/metro2-first-playable
    paths:
      - 'metro2/**'
      - '.github/workflows/metro2-web-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: metro2-web-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout first-playable
        uses: actions/checkout@v4
        with:
          ref: feature/metro2-first-playable
      - name: Fetch already saved optimized head car (no re-export)
        uses: actions/checkout@v4
        with:
          ref: feature/metro2-v106-aggressive-lod
          path: saved-models
          sparse-checkout: metro2/assets/v106_mobile
      - name: Restore saved optimized head car
        run: |
          python3 saved-models/metro2/assets/v106_mobile/restore_glb.py
          mkdir -p metro2/assets/v106
          cp saved-models/metro2/assets/v106_mobile/v106_car01_mobile.glb metro2/assets/v106/v106_car_01.glb
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("metro2/assets/v106/v106_car_01.glb")
          assert p.stat().st_size == 21216508
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "aed209d835f6f2a50090cbcbe283ec1467853a2d598591801196618f8ae4c48a"
          print("PASS: saved optimized head car verified")
          PY
      - name: Setup Godot 4.3
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          curl -fsSL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Select isolated preview scene for this build only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("metro2/project.godot")
          data = p.read_text()
          assert 'run/main_scene="res://scenes/StationV106Integration.tscn"' in data
          p.write_text(data.replace('run/main_scene="res://scenes/StationV106Integration.tscn"', 'run/main_scene="res://scenes/WebPreviewOptimizedCar.tscn"'))
          PY
      - name: Import resources
        run: godot --headless --path metro2 --editor --import --quit
      - name: Export Web preview
        run: |
          mkdir -p metro2/build/web
          godot --headless --path metro2 --export-release "Web" build/web/index.html
          test -s metro2/build/web/index.html
          test -s metro2/build/web/index.wasm
          test -s metro2/build/web/index.pck
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: metro2/build/web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
