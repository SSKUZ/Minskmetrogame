name: Metro2 Goodmix orientation and station lettering
on:
  push:
    branches: [feature/metro2-artwork-signs-v54]
    paths:
      - '.github/workflows/metro2-artwork-signs-v54.yml'
      - 'metro2/scripts/depot/goodmix_restore.gd'
      - 'metro2/scripts/depot/saloon_advertising_v46.gd'
      - 'metro2/scripts/station/uruchye_architecture.gd'
      - 'metro2/modules/stations/borisovsky_trakt/borisovsky_trakt.gd'
      - 'metro2/assets/signage_v54/**'
      - 'metro2/tools/artwork_v54/**'
permissions:
  contents: write
concurrency:
  group: metro2-permanent-viewer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Reuse published game and module assets
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin gh-pages
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/artwork-pages-base"
          python3 metro2/tools/artwork_v54/publish.py prepare artwork-web "$(cat "$RUNNER_TEMP/artwork-pages-base")"
      - name: Import changed scripts and export updated Web resource packs
        shell: bash
        run: |
          set -euo pipefail
          python3 metro2/tools/artwork_v54/publish.py build artwork-web
          python3 metro2/tools/artwork_v54/publish.py finish artwork-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-build-${{ github.sha }}
          path: artwork-web/
          retention-days: 7
      - name: Publish passengers and depot without replacing other modules
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/artwork-pages" "$(cat "$RUNNER_TEMP/artwork-pages-base")"
          cp -a artwork-web/game/. "$RUNNER_TEMP/artwork-pages/metro2/passenger-demo/"
          cp -a artwork-web/viewer/. "$RUNNER_TEMP/artwork-pages/metro2/module-viewer/"
          cd "$RUNNER_TEMP/artwork-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- metro2/passenger-demo metro2/module-viewer
          git commit -m 'Fix upright Goodmix prints, station names and door route diagrams'
          git push origin HEAD:gh-pages
