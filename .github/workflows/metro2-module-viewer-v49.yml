name: Metro2 automatic changed-module Web deployment
on:
  push:
    branches:
      - feature/metro2-automated-module-deploy
      - 'feature/metro2-auto/**'
    paths:
      - '.github/workflows/metro2-module-viewer-v49.yml'
      - 'metro2/config/module_deploy_manifest.json'
      - 'metro2/tools/automated_deploy/**'
      - 'metro2/modules/**'
      - 'metro2/scripts/**'
      - 'metro2/assets/**'
      - 'metro2/audio/**'
      - '!metro2/audio/data/identification_tz54_1/**'
      - '!metro2/audio/tools/**'
      - 'metro2/viewers/**'
      - '!**/*.md'
      - '!**/*.txt'
      - '!**/*.mp4'
      - '!**/*.mov'
      - '!**/*.zip'
      - '!**/*.uid'
      - '!**/references*/**'
      - '!**/tests/**'
  workflow_dispatch:
    inputs:
      legacy_export:
        description: 'Explicit rollback to historical V49 exporter on its original branch only'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: metro2-auto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    # TZ62.1 is archived; TZ62.2 supersedes animated cab doors.
    if: github.event_name == 'push' && github.ref_name != 'feature/metro2-auto/integration/v106-side-cab-doors-tz62-1'
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.select.outputs.active }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - name: Determine changed modules from the existing registry
        id: select
        run: python3 metro2/tools/automated_deploy/deploy.py plan
      - uses: actions/upload-artifact@v4
        with:
          name: metro2-deploy-plan-${{ github.sha }}
          path: .metro2-ci/plan.json
          retention-days: 7
  build:
    needs: plan
    if: needs.plan.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
      max-parallel: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: metro2-deploy-plan-${{ github.sha }}
          path: .metro2-ci
      - name: Prepare native packaging tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3 ffmpeg xvfb xauth libgl1 libgl1-mesa-dri libxrandr2 libxinerama1 libxcursor1 libxi6
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --filter=blob:none --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
      - uses: actions/cache@v4
        with:
          path: .metro2-ci/stage/${{ matrix.module }}/.godot/imported
          key: metro2-import-godot43-web-${{ runner.os }}-${{ matrix.module }}-${{ hashFiles('metro2/config/module_deploy_manifest.json') }}-${{ hashFiles('.metro2-ci/plan.json') }}
          restore-keys: |
            metro2-import-godot43-web-${{ runner.os }}-${{ matrix.module }}-${{ hashFiles('metro2/config/module_deploy_manifest.json') }}-
      - uses: actions/cache@v4
        with:
          path: .metro2-ci/static-cache/${{ matrix.module }}
          key: metro2-static-godot43-${{ matrix.module }}-${{ hashFiles('metro2/tools/automated_deploy/static_world/**', 'metro2/modules/line/**', 'metro2/modules/stations/**', 'metro2/scripts/tunnel*', 'metro2/scripts/station/**', 'metro2/audio/data/audio_catalog.json', 'metro2/audio/resources/tz54/**') }}
          restore-keys: |
            metro2-static-godot43-${{ matrix.module }}-
      - name: Prepare static world, import resources and package changed Web modules
        shell: bash
        env:
          MODULE_ID: ${{ matrix.module }}
        run: python3 metro2/tools/automated_deploy/deploy.py build --module "$MODULE_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: metro2-module-${{ matrix.module }}-${{ github.sha }}
          path: .metro2-ci/bundles/${{ matrix.module }}
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: metro2-export-error-${{ matrix.module }}-${{ github.sha }}
          path: .metro2-ci/logs
          retention-days: 7
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: metro2-permanent-viewer-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: metro2-deploy-plan-${{ github.sha }}
          path: .metro2-ci
      - uses: actions/download-artifact@v4
        with:
          pattern: metro2-module-*-${{ github.sha }}
          path: .metro2-ci/downloads
      - name: Collect only this run's module deltas
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path('.metro2-ci')
          plan=json.loads((root/'plan.json').read_text())
          for key in plan['modules']:
              source=root/'downloads'/('metro2-module-'+key+'-${{ github.sha }}')
              target=root/'bundles'/key
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copytree(source,target)
          PY
      - name: Merge selected metadata into latest publication and push atomically
        run: python3 metro2/tools/automated_deploy/deploy.py publish
  legacy_viewer:
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_export && github.ref == 'refs/heads/feature/metro2-v106-realism-v49'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore existing verified assets; no model export
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          python3 metro2/tools/prepare_first_playable_assets.py
          python3 - <<'PY'
          import hashlib,io,pathlib,sys,zipfile
          sys.path.insert(0,'metro2/tools')
          from web_publication import GitHub,Archive,REPO
          api=GitHub()
          archive=Archive(api,'7a1ddfc6b07408340eab560904c11de42463b79f')
          asset=archive.assets['cab-r21-source-7a1ddfc6b07408340eab560904c11de42463b79f-1.zip']
          data=api.request(f'/repos/{REPO}/releases/assets/{asset["id"]}',raw=True,headers={'Accept':'application/octet-stream'})
          assert hashlib.sha256(data).hexdigest()=='5cafe0c435faf9a1ad78e69732797225bdc6465853cf7df6f41dd2cc31eab4ae'
          out=pathlib.Path('metro2/assets/cab_r21')
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              for name in ['cab_r21.glb','cab_r21.json','malinovka_arrival.mp3','malinovka_departure_petrovshchina.mp3']:
                  (out/name).write_bytes(z.read('assets/cab_r21/'+name))
          PY
      - name: Stage viewer dependencies and import resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p viewer-v49-logs
          python3 metro2/tools/prepare_module_viewer.py --output "$RUNNER_TEMP/viewer-project"
          cp "$RUNNER_TEMP/viewer-project/viewer-dependencies.json" viewer-v49-logs/
          godot --headless --editor --path "$RUNNER_TEMP/viewer-project" --import > viewer-v49-logs/import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' viewer-v49-logs/import.log; then exit 1; fi
      - name: Export standalone Web viewer once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p viewer-v49-web "$HOME/.local/share/godot/export_templates"
          if [ "$HOME" != /root ]; then
            cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi
          if ! godot --headless --path "$RUNNER_TEMP/viewer-project" --export-release 'Web Viewer' "$PWD/viewer-v49-web/index.html" > viewer-v49-logs/export.log 2>&1; then
            cat viewer-v49-logs/export.log
            exit 1
          fi
          python3 metro2/tools/finalize_viewer_web.py viewer-v49-web/index.html
          test -s viewer-v49-web/index.html
          test -s viewer-v49-web/index.pck
          test -s viewer-v49-web/index.wasm
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path('viewer-v49-web')
          (out/'build-info.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'godot':'4.3','entry':'res://viewers/module_viewer.tscn','advertising':'ENABLED — V49 FIXED MOUNTS','published':False},ensure_ascii=False,indent=2))
          PY
          cd viewer-v49-web
          sha256sum index.* build-info.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: metro2-module-viewer-v49-${{ github.sha }}
          path: viewer-v49-web/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metro2-viewer-v49-validation-${{ github.sha }}
          path: viewer-v49-logs/
          retention-days: 30

      - name: Prepare isolated viewer update without moving gh-pages
        run: python3 metro2/tools/prepare_v49_publication.py
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-v49-publication-proof
          path: viewer-v49-publication.json
          retention-days: 30
