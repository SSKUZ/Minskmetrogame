# TZ45: one-time Web build and Pages publication for premium controls (source 900a860f).
name: Metro2 TZ44 caution decal dedup Web
on:
  workflow_dispatch:
  push:
    branches: [feature/metro2-v106-warning-stickers-dedup]
    paths:
      - '.github/workflows/metro2-surface-depot-v40-web.yml'
      - 'metro2/scripts/depot/**'
      - 'metro2/scripts/station_base_static.gd'
      - 'metro2/scripts/station/**'
      - 'metro2/assets/station/**'
      - 'metro2/scripts/playable_track_path.gd'
      - 'metro2/scenes/StationBaseStatic.tscn'
      - 'metro2/scenes/depot/**'
      - 'metro2/assets/depot/**'
      - 'metro2/project.godot'
      - 'metro2/scripts/cab_v37.gd'
      - 'metro2/scripts/cab_view_cleanup_v37.gd'
      - 'metro2/tools/web_publication.py'
      - 'metro2/scripts/train_interior_v36.gd'
      - 'metro2/scripts/v33_door_controller.gd'
      - 'metro2/tools/prepare_cab.py'
      - 'metro2/assets/cab_r21/**'
      - 'metro2/scripts/cab_r36_material.gdshader'
      - 'metro2/tools/export_cab_r21.mjs'
      - 'metro2/scripts/v106_four_cars_preview.gd'
      - 'metro2/scripts/v106_warning_stickers.gd'
      - 'metro2/assets/v106_warning/**'
      - 'metro2/scripts/tunnel_lightweight_straight.gd'
permissions:
  contents: read
concurrency:
  group: metro2-v106-warning-stickers-dedup
  cancel-in-progress: true
jobs:
  cab_assets:
    if: ${{ !startsWith(github.event.head_commit.message, 'publish-only:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: metro2/tools/web_publication.py
          sparse-checkout-cone-mode: false
      - name: Restore the already verified cab export, without exporting models again
        run: |
          python3 - <<'PY'
          import sys,json,hashlib,pathlib,zipfile,io
          sys.path.insert(0,'metro2/tools')
          from web_publication import GitHub,Archive,REPO
          api=GitHub();archive=Archive(api,'7a1ddfc6b07408340eab560904c11de42463b79f')
          name='cab-r21-source-7a1ddfc6b07408340eab560904c11de42463b79f-1.zip'
          asset=archive.assets[name]
          data=api.request(f'/repos/{REPO}/releases/assets/{asset["id"]}',raw=True,headers={'Accept':'application/octet-stream'})
          if asset.get('digest'):assert asset['digest']=='sha256:'+hashlib.sha256(data).hexdigest()
          out=pathlib.Path('cab-export');out.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            assert z.testzip() is None
            for file in ['cab_r21.glb','cab_r21.json','malinovka_arrival.mp3','malinovka_departure_petrovshchina.mp3']:
              (out/file).write_bytes(z.read('assets/cab_r21/'+file))
          recipe=json.loads((out/'cab_r21.json').read_text())
          assert recipe['source_commit']=='aef6e01a10c9750582c93697536b3e56a62ac3f2'
          assert recipe['verified_nonempty_images']==26 and len(recipe['controls'])==40
          assert recipe['glb_sha256']==hashlib.sha256((out/'cab_r21.glb').read_bytes()).hexdigest()
          print('VERIFIED_CAB_REUSED',recipe['glb_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cab-r21-original-export
          path: cab-export/
          retention-days: 7
  export:
    needs: cab_assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cab-r21-original-export
          path: cab-export
      - name: Prepare isolated four-car project from this commit
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          python3 metro2/tools/prepare_first_playable_assets.py
          mkdir -p stage/scripts stage/scenes stage/tests stage/assets/v106_lod1 stage/build/web
          cp metro2/project.godot metro2/export_presets.cfg stage/
          cp metro2/scripts/v106_four_cars_preview.gd metro2/scripts/tunnel_lightweight_straight.gd metro2/scripts/v106_warning_stickers.gd stage/scripts/
          mkdir -p stage/assets/v106_warning
          cp metro2/assets/v106_warning/*.png stage/assets/v106_warning/
          cp metro2/scripts/cab_v37.gd metro2/scripts/cab_view_cleanup_v37.gd metro2/scripts/v33_door_controller.gd metro2/scripts/train_interior_v36.gd stage/scripts/
          mkdir -p stage/assets/cab_r21
          cp -a cab-export/. stage/assets/cab_r21/
          cp metro2/assets/cab_r21/cab_r21.glb.import stage/assets/cab_r21/
          cp metro2/scripts/cab_r36_material.gdshader stage/scripts/
          cp metro2/scenes/v106_four_cars_preview.tscn stage/scenes/
          mkdir -p stage/scripts/depot stage/scenes/depot stage/assets/depot
          cp metro2/scripts/depot/*.gd stage/scripts/depot/
          cp metro2/scenes/depot/*.tscn stage/scenes/depot/
          cp metro2/scenes/StationBaseStatic.tscn stage/scenes/
          cp metro2/scripts/station_base_static.gd metro2/scripts/playable_track_path.gd stage/scripts/
          mkdir -p stage/scripts/station stage/assets/station
          cp metro2/assets/station/*.png stage/assets/station/
          cp metro2/scripts/station/*.gd stage/scripts/station/
          cp metro2/assets/depot/industrial_surface.gdshader stage/assets/depot/
          cp metro2/assets/v106_lod1/v106_car01_lod1_mesh289_normals_fixed.glb stage/assets/v106_lod1/
          cp metro2/assets/v106_lod1/v106_car01_lod1_mesh289_normals_fixed.glb.import stage/assets/v106_lod1/
          for file in metro2/assets/v106_lod1/v106_car01_lod1_mesh289_normals_fixed_*.png*; do
            if [ -f "$file" ]; then cp "$file" stage/assets/v106_lod1/; fi
          done
          for car in 02 03 04; do
            mkdir -p "stage/assets/v106_original/car$car"
            cp "metro2/assets/v106_original/car$car/v106_car_$car.glb" "stage/assets/v106_original/car$car/"
            cp "metro2/assets/v106_original/car$car/v106_car_$car.glb.import" "stage/assets/v106_original/car$car/"
            for file in "metro2/assets/v106_original/car$car/"*.png*; do
              if [ -f "$file" ]; then cp "$file" "stage/assets/v106_original/car$car/"; fi
            done
          done
          python3 - <<'PY'
          import pathlib,hashlib,json,os
          root=pathlib.Path('stage')
          p=root/'project.godot'
          s=p.read_text().replace('res://scenes/station_v106_first_playable.tscn','res://scenes/depot/surface_depot_v40.tscn')
          s=s.replace('[display]\n','[display]\nwindow/stretch/mode="canvas_items"\nwindow/stretch/aspect="expand"\n')
          p.write_text(s)
          p=root/'export_presets.cfg'
          s=p.read_text().replace('export_filter="scenes"','export_filter="all_resources"')
          s=s.replace('include_filter=""','include_filter="*.json"')
          s=s.replace('include_filter="*v106_door_controller.gd"','include_filter="*.json"')
          s=s.replace('vram_texture_compression/for_mobile=true','vram_texture_compression/for_mobile=false')
          s=s.replace('org.minskmetro.metro2alpha01','org.minskmetro.metro2tz30')
          s=s.replace('Minsk Metro 2 First Playable','Minsk Metro 2.0 TZ30')
          p.write_text(s)
          files=list(root.rglob('*.glb'))+list(root.rglob('*.glb.import'))+list((root/'scripts').rglob('*.gd'))+list(root.rglob('*.gdshader'))+[root/'assets/cab_r21/cab_r21.json']
          for meta in root.rglob('*.glb.import'):
            assert 'meshes/generate_lods=false' in meta.read_text()
            assert 'meshes/force_disable_compression=true' in meta.read_text()
          manifest={'source_commit':os.environ['GITHUB_SHA'],'route':'uruchye-v42','main_scene':'res://scenes/depot/surface_depot_v40.tscn','godot':'4.3','cab_source':{'branch':'cab-development','commit':'aef6e01a10c9750582c93697536b3e56a62ac3f2','version':'cab-r2.1','sha256':hashlib.sha256((root/'assets/cab_r21/cab_r21.glb').read_bytes()).hexdigest()},'models_and_scripts':{
            str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in files}}
          (root/'build-info.json').write_text(json.dumps(manifest,indent=2))
          PY
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ "$HOME" != /root ]; then
            cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi
          godot --headless --path stage --editor --import --quit > import.log 2>&1
          if grep -E 'SCRIPT ERROR|ERROR:' import.log; then exit 1; fi
          godot --headless --path stage --export-release Web build/web/index.html > export.log 2>&1
          if grep -E 'SCRIPT ERROR|ERROR:' export.log; then exit 1; fi
          test -s stage/build/web/index.pck
          cp stage/build-info.json stage/build/web/
      - uses: actions/upload-artifact@v4
        with:
          name: tz40-web-build
          path: stage/build/web/
          retention-days: 7
  publish:
    if: ${{ always() && (needs.export.result == 'success' || startsWith(github.event.head_commit.message, 'publish-only:')) }}
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-tools
          sparse-checkout: metro2/tools/web_publication.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: tz40-web-build
          path: web
          github-token: ${{ github.token }}
          # Recovery reuses the already successful export, without importing models again.
          run-id: ${{ startsWith(github.event.head_commit.message, 'publish-only:') && '42388367676' || github.run_id }}
      - name: Read the actual source commit of the downloaded build
        env:
          RECOVERY_ONLY: ${{ startsWith(github.event.head_commit.message, 'publish-only:') }}
        run: |
          python3 - <<'PY'
          import json,os,hashlib
          info=json.load(open('web/build-info.json'))
          if os.environ['RECOVERY_ONLY']=='true':
            assert info['source_commit']=='193a05680a27dee288d727c629a659a1339fe279','Unexpected recovery build'
          pack_sha=hashlib.sha256(open('web/index.pck','rb').read()).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a') as f:
            f.write('WEB_SOURCE_SHA='+info['source_commit']+'\n')
            f.write('WEB_PCK_SHA256='+pack_sha+'\n')
          print('READY_BUILD_VERIFIED',info['source_commit'],pack_sha)
          PY
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site
          fetch-depth: 1
      - name: Publish Uruchye Web and await deployment
        run: |
          set -euo pipefail
          python3 release-tools/metro2/tools/web_publication.py publish --site published-site --new-build web --commit "$WEB_SOURCE_SHA" --channel uruchye-v42
          cd published-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- metro2
          if ! git diff --cached --quiet; then
            git commit -m "Publish Uruchye V42 Web $WEB_SOURCE_SHA with two retained builds"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
          echo "PAGES_PUBLISH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cd ..
      - name: Verify Pages deployment and published files without running the game
        run: |
          python3 - <<'PYTHON'
          import urllib.request,time,json,os,sys,hashlib
          sys.path.insert(0,'release-tools/metro2/tools')
          from web_publication import GitHub,REPO
          api=GitHub();published=os.environ['PAGES_PUBLISH_SHA']
          for attempt in range(120):
            runs=api.request(f'/repos/{REPO}/actions/runs?head_sha={published}&per_page=20')['workflow_runs']
            pages=next((run for run in runs if run['name']=='pages build and deployment'),None)
            if pages and pages['status']=='completed':
              if pages['conclusion']!='success':raise RuntimeError('Pages deployment failed: '+pages['html_url'])
              print('PAGES_DEPLOYMENT_SUCCESS',published,pages['html_url'],flush=True)
              break
            if attempt%6==0:print('WAITING_FOR_PAGES',published,pages['status'] if pages else 'queued',flush=True)
            time.sleep(10)
          else:raise RuntimeError('Pages deployment timeout')
          url='https://sskuz.github.io/Minskmetrogame/metro2/uruchye-v42/'+os.environ['WEB_SOURCE_SHA']+'/'
          for attempt in range(18):
            try:
              with urllib.request.urlopen(url+'build-info.json?deploy='+str(time.time()),timeout=20) as response:
                data=json.load(response)
              if data['source_commit']==os.environ['WEB_SOURCE_SHA']:
                break
            except Exception:
              pass
            time.sleep(10)
          else:raise RuntimeError('Published build provenance unavailable')
          for page in [url+'index.html','https://sskuz.github.io/Minskmetrogame/metro2/uruchye-v42/index.html']:
            with urllib.request.urlopen(page,timeout=30) as response:
              assert response.status==200 and response.read(),'Published index.html unavailable'
          with urllib.request.urlopen(url+'index.pck',timeout=90) as response:
            assert response.status==200,'Published index.pck unavailable'
            digest=hashlib.sha256()
            for chunk in iter(lambda:response.read(1024*1024),b''):digest.update(chunk)
          assert digest.hexdigest()==os.environ['WEB_PCK_SHA256'],'Published game pack differs from the ready artifact'
          print('TZ42_WEB_PUBLISHED',url,'source_commit='+data['source_commit'],'pck_sha256='+digest.hexdigest())
          PYTHON



