name: Metro2 Ploshchad Lenina owner-photo reconstruction V67
on:
  push:
    branches: [feature/metro2-lenina-photo-v67]
    paths:
      - '.github/workflows/metro2-lenina-photo-v67.yml'
      - 'metro2/modules/stations/ploshchad_lenina/**'
      - 'metro2/tools/lenina_photo_v67/**'
      - 'metro2/modules/core/module_catalog.gd'
      - 'metro2/viewers/module_viewer.gd'
permissions:
  contents: write
concurrency:
  group: metro2-permanent-viewer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current viewer and export only Ploshchad Lenina
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin gh-pages
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/lenina-photo-v67-pages-base"
          python3 metro2/tools/lenina_photo_v67/publish.py prepare lenina-photo-v67 "$(cat "$RUNNER_TEMP/lenina-photo-v67-pages-base")"
      - name: Mandatory Godot resource import and station Web packs export
        shell: bash
        run: |
          set -euo pipefail
          python3 metro2/tools/lenina_photo_v67/publish.py build lenina-photo-v67
          python3 metro2/tools/lenina_photo_v67/publish.py finish lenina-photo-v67
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lenina-photo-v67-${{ github.sha }}
          path: lenina-photo-v67/
          retention-days: 7
      - name: Publish updated Ploshchad Lenina to permanent viewer
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/lenina-photo-v67-pages" "$(cat "$RUNNER_TEMP/lenina-photo-v67-pages-base")"
          cp -a lenina-photo-v67/web/. "$RUNNER_TEMP/lenina-photo-v67-pages/metro2/module-viewer/"
          cd "$RUNNER_TEMP/lenina-photo-v67-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- metro2/module-viewer
          git commit -m 'Add Ploshchad Lenina with single vault, descending interchange stairs and photo architecture; preserve existing packs'
          git push origin HEAD:gh-pages
