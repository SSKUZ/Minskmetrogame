name: Metro2 TZ31 realistic tunnel Web
on:
  push:
    branches: [feature/metro2-tunnel-realistic-v31]
    paths:
      - '.github/workflows/metro2-tunnel-v31-web.yml'
      - 'metro2/project.godot'
      - 'metro2/scripts/v106_four_cars_preview.gd'
      - 'metro2/scripts/tunnel_lightweight_straight.gd'
permissions:
  contents: read
concurrency:
  group: metro2-tz31-web
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated four-car project from this commit
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          python3 metro2/tools/prepare_first_playable_assets.py
          mkdir -p stage/scripts stage/scenes stage/tests stage/assets/v106_lod1 stage/build/web
          cp metro2/project.godot metro2/export_presets.cfg stage/
          cp metro2/scripts/v106_four_cars_preview.gd metro2/scripts/tunnel_lightweight_straight.gd stage/scripts/
          cp metro2/scenes/v106_four_cars_preview.tscn stage/scenes/
          cp metro2/assets/v106_lod1/v106_car01_lod1_mesh289_normals_fixed.glb stage/assets/v106_lod1/
          cp metro2/assets/v106_lod1/v106_car01_lod1_mesh289_normals_fixed.glb.import stage/assets/v106_lod1/
          for file in metro2/assets/v106_lod1/v106_car01_lod1_mesh289_normals_fixed_*.png*; do
            if [ -f "$file" ]; then cp "$file" stage/assets/v106_lod1/; fi
          done
          for car in 02 03 04; do
            mkdir -p "stage/assets/v106_original/car$car"
            cp "metro2/assets/v106_original/car$car/v106_car_$car.glb" "stage/assets/v106_original/car$car/"
            cp "metro2/assets/v106_original/car$car/v106_car_$car.glb.import" "stage/assets/v106_original/car$car/"
            for file in "metro2/assets/v106_original/car$car/"*.png*; do
              if [ -f "$file" ]; then cp "$file" "stage/assets/v106_original/car$car/"; fi
            done
          done
          python3 - <<'PY'
          import pathlib,hashlib,json,os
          root=pathlib.Path('stage')
          p=root/'project.godot'
          s=p.read_text().replace('res://scenes/station_v106_first_playable.tscn','res://scenes/v106_four_cars_preview.tscn')
          s=s.replace('[display]\n','[display]\nwindow/stretch/mode="canvas_items"\nwindow/stretch/aspect="expand"\n')
          p.write_text(s)
          p=root/'export_presets.cfg'
          s=p.read_text().replace('export_filter="scenes"','export_filter="all_resources"')
          s=s.replace('include_filter=""','include_filter="build-info.json"')
          s=s.replace('include_filter="*v106_door_controller.gd"','include_filter="build-info.json"')
          s=s.replace('vram_texture_compression/for_mobile=true','vram_texture_compression/for_mobile=false')
          s=s.replace('org.minskmetro.metro2alpha01','org.minskmetro.metro2tz30')
          s=s.replace('Minsk Metro 2 First Playable','Minsk Metro 2.0 TZ30')
          p.write_text(s)
          files=list(root.rglob('*.glb'))+list(root.rglob('*.glb.import'))+list((root/'scripts').glob('*.gd'))
          for meta in root.rglob('*.glb.import'):
            assert 'meshes/generate_lods=false' in meta.read_text()
            assert 'meshes/force_disable_compression=true' in meta.read_text()
          manifest={'source_commit':os.environ['GITHUB_SHA'],'godot':'4.3','models_and_scripts':{
            str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in files}}
          (root/'build-info.json').write_text(json.dumps(manifest,indent=2))
          PY
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ "$HOME" != /root ]; then
            cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi
          godot --headless --path stage --editor --import --quit > import.log 2>&1
          if grep -E 'SCRIPT ERROR|ERROR:' import.log; then exit 1; fi
          godot --headless --path stage --export-release Web build/web/index.html > export.log 2>&1
          if grep -E 'SCRIPT ERROR|ERROR:' export.log; then exit 1; fi
          test -s stage/build/web/index.pck
          cp stage/build-info.json stage/build/web/
      - uses: actions/upload-artifact@v4
        with:
          name: tz31-web-build
          path: stage/build/web/
  publish:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tz31-web-build
          path: web
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site
          fetch-depth: 1
      - name: Publish separate version, preserving TZ30 and earlier games
        run: |
          set -euo pipefail
          dest="published-site/metro2/tunnel-realistic-v31/$GITHUB_SHA"
          mkdir -p "$dest"
          cp -a web/. "$dest/"
          cd published-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "metro2/tunnel-realistic-v31/$GITHUB_SHA"
          git commit -m "Publish TZ31 realistic tunnel Web $GITHUB_SHA"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Minimal visual check of the published game
        run: |
          npm install playwright pngjs
          mkdir -p evidence
          cat > check.cjs <<'JS'
          const {chromium}=require('playwright');
          const {PNG}=require('pngjs');
          const fs=require('fs');
          const assert=require('node:assert/strict');
          (async()=>{
            const url='https://sskuz.github.io/Minskmetrogame/metro2/tunnel-realistic-v31/'+process.env.GITHUB_SHA+'/';
            let info;
            for(let i=0;i<40;i++){
              try{const r=await fetch(url+'build-info.json?check='+Date.now());if(r.ok){info=await r.json();break;}}catch{}
              await new Promise(r=>setTimeout(r,10000));
            }
            assert.equal(info?.source_commit,process.env.GITHUB_SHA);
            const b=await chromium.launch({channel:'chrome',args:['--use-angle=swiftshader']});
            const page=await b.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{
              if(m.type()==='error'&&!m.text().includes('favicon')){errors.push(m.text());console.log('ERROR '+m.text());}
            });
            await page.goto(url);
            await page.waitForFunction(()=>window.metro2Diagnostics?.cars===4&&window.metro2Diagnostics.coverage,null,{timeout:180000});
            await page.screenshot({path:'evidence/external.png',timeout:120000});
            const png=PNG.sync.read(fs.readFileSync('evidence/external.png'));
            let visible=0;
            for(let y=100;y<550;y++)for(let x=100;x<1000;x++){
              const i=(y*png.width+x)*4;if(png.data[i]+png.data[i+1]+png.data[i+2]>90)visible++;
            }
            assert(visible>5000,'3D not visible');
            await page.mouse.click(640,599);
            await page.waitForFunction(()=>window.metro2Diagnostics?.view==='cabin',null,{timeout:90000});
            await page.screenshot({path:'evidence/tunnel-ahead.png',timeout:120000});
            assert.deepEqual(errors,[]);
            fs.writeFileSync('evidence/url.txt',url);
            console.log('TZ31_PUBLISHED_VISUAL_PASS '+url);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          timeout 10m node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tz31-minimal-visual-evidence
          path: evidence/
