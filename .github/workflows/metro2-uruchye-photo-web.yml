name: Uruchye photo rebuild — Web publication only
on:
  push:
    branches: [feature/metro2-uruchye-photo-rebuild]
    paths:
      - 'metro2/scripts/station/uruchye_architecture.gd'
      - 'metro2/assets/station/photo_reference/**'
      - 'metro2/tools/uruchye_web_update.py'
      - '.github/workflows/metro2-uruchye-photo-web.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metro2-uruchye-web-publication
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage station dependencies only
        run: |
          apt-get update -qq
          apt-get install -y -qq python3
          python3 metro2/tools/uruchye_web_update.py stage /tmp/uruchye-web
      - name: Import and build the station Web resource pack
        env:
          FAST_VIEWER_OUTPUT: /tmp/uruchye-pack
        run: |
          godot --headless --editor --path /tmp/uruchye-web --import
          godot --headless --path /tmp/uruchye-web --script res://tools/fast_loading/build_module_packs.gd
      - name: Publish station update to permanent viewer
        run: python3 metro2/tools/uruchye_web_update.py publish /tmp/uruchye-pack
