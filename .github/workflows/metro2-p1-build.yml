name: Metro 2 P1 native Android and Web builds

on:
  push:
    branches:
      - feature/metro2-godot-p1
    paths:
      - 'metro2/android-prototype/**'
      - '.github/workflows/metro2-p1-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Godot 4.3 native export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.3
    defaults:
      run:
        shell: bash
        working-directory: metro2/android-prototype
    steps:
      - uses: actions/checkout@v4
      - name: Environment and templates
        run: |
          set -euxo pipefail
          godot --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          command -v keytool
          ls -la /root/.local/share/godot/export_templates || true
      - name: Configure Android export environment
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot" "$HOME/.config/godot"
          if [ "$HOME" != /root ]; then
            cp -a /root/.local/share/godot/export_templates "$HOME/.local/share/godot/"
          fi
          java_sdk="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          debug_key="$HOME/.local/share/godot/debug.keystore"
          if [ ! -f "$debug_key" ]; then
            keytool -genkeypair -keystore "$debug_key" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$java_sdk"
          export/android/debug_keystore = "$debug_key"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import project and validate GDScript
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --import --quit
      - name: Export native Android APK
        run: |
          set -euxo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug Android build/android/MinskMetro2-P1-debug.apk
          test -s build/android/MinskMetro2-P1-debug.apk
          sha256sum build/android/MinskMetro2-P1-debug.apk > build/android/SHA256SUMS.txt
      - name: Export browser build
        if: success()
        run: |
          set -euxo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro2-p1-android-debug
          path: metro2/android-prototype/build/android/
          if-no-files-found: warn
      - name: Upload browser build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro2-p1-web
          path: metro2/android-prototype/build/web/
          if-no-files-found: warn
