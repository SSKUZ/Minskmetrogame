name: Metro2 station contact rails and four live clocks
on:
  push:
    branches: [feature/metro2-station-infrastructure-v52]
    paths:
      - '.github/workflows/metro2-station-infrastructure-v52.yml'
      - 'metro2/scripts/**'
      - 'metro2/modules/stations/borisovsky_trakt/**'
      - 'metro2/tools/infrastructure/**'
permissions:
  contents: write
concurrency:
  group: metro2-permanent-viewer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Reuse current published resource packs
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin gh-pages
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/infrastructure-pages-base"
          python3 metro2/tools/infrastructure/publish.py prepare infrastructure-web "$(cat "$RUNNER_TEMP/infrastructure-pages-base")"
      - name: Mandatory import and Web resource pack export without scene execution
        shell: bash
        run: |
          set -euo pipefail
          python3 metro2/tools/infrastructure/publish.py build infrastructure-web
          python3 metro2/tools/infrastructure/publish.py finish infrastructure-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-infrastructure-${{ github.sha }}
          path: infrastructure-web/
          retention-days: 14
      - name: Publish updated station and depot packages only
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/infrastructure-pages" "$(cat "$RUNNER_TEMP/infrastructure-pages-base")"
          find infrastructure-web -maxdepth 1 -type f -exec cp {} "$RUNNER_TEMP/infrastructure-pages/metro2/module-viewer/" \;
          cd "$RUNNER_TEMP/infrastructure-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- metro2/module-viewer
          git commit -m 'Continuous station/depot contact rails; four live station clocks; swap Uruchye boarding signs'
          git push origin HEAD:gh-pages
