name: Metro 2 Godot browser preview (artifact only)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/metro2-tunnel-v2
    paths:
      - 'metro2/**'
      - '.github/workflows/metro2-browser-preview.yml'

permissions:
  contents: write

concurrency:
  group: metro2-browser-preview
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Python for asset restoration
        run: |
          apt-get update -qq
          apt-get install -y -qq python3
      - name: Restore train and cab assets
        run: |
          set -euo pipefail
          python3 metro2/tools/prepare_first_playable_assets.py
          python3 metro2/tools/prepare_cab.py
          python3 metro2/tools/prepare_announcements.py
      - name: Install Godot Web export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/web_nothreads_release.zip"
      - name: Import and validate Godot project
        run: |
          set -euo pipefail
          godot --headless --path metro2 --editor --import --quit
      - name: Export HTML5 preview
        run: |
          set -euo pipefail
          mkdir -p metro2/build/web
          godot --headless --path metro2 --export-release Web build/web/index.html
          test -s metro2/build/web/index.html
          test -s metro2/build/web/index.wasm
          test -s metro2/build/web/index.pck
          touch metro2/build/web/.nojekyll
      - name: Export isolated Godot 3D probe
        run: |
          set -euo pipefail
          cp metro2/project.godot metro2/project.godot.original
          sed -i 's|^run/main_scene=.*|run/main_scene="res://scenes/web_render_probe.tscn"|' metro2/project.godot
          mkdir -p metro2/build/probe
          godot --headless --path metro2 --export-release Web build/probe/index.html
          mv metro2/project.godot.original metro2/project.godot
          test -s metro2/build/probe/index.pck
          touch metro2/build/probe/.nojekyll
      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: metro2-browser-preview
          path: metro2/build/web/
          if-no-files-found: error

      - name: Checkout live gh-pages branch separately
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
          fetch-depth: 0
          path: published-site
      - name: Publish Godot under /metro2 without changing old website
        shell: bash
        run: |
          set -euo pipefail
          test -f published-site/index.html
          test -f metro2/build/web/index.html
          find metro2/build/web -type f -size +95M -print -quit | grep -q . && { echo "Web export has a file >95MB; refusing GitHub push"; exit 1; } || true
          mkdir -p published-site/metro2
          cp -a metro2/build/web/. published-site/metro2/
          mkdir -p published-site/metro2/probe
          cp -a metro2/build/probe/. published-site/metro2/probe/
          cd published-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- metro2
          if git diff --cached --quiet; then
            echo "Godot preview already published"
            exit 0
          fi
          git commit -m "Publish Godot Metro 2 under /metro2 on gh-pages (preserve legacy root)"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
