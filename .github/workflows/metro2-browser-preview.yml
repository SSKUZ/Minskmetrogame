name: Metro 2 Godot browser preview (artifact only)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/metro2-tunnel-v2
    paths:
      - 'metro2/**'
      - '.github/workflows/metro2-browser-preview.yml'

permissions:
  contents: write

concurrency:
  group: metro2-browser-preview
  cancel-in-progress: true

jobs:
  web:
    if: ${{ !contains(github.event.head_commit.message, '[four-car-audit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Python for asset restoration
        run: |
          apt-get update -qq
          apt-get install -y -qq python3
      - name: Restore train and cab assets
        run: |
          set -euo pipefail
          python3 metro2/tools/prepare_first_playable_assets.py
          python3 metro2/assets/v106_original/car02/restore_glb.py
          python3 metro2/assets/v106_original/car03/restore_glb.py
          python3 metro2/assets/v106_original/car04/restore_glb.py
          python3 metro2/tools/prepare_cab.py
          python3 metro2/tools/prepare_announcements.py
      - name: Install Godot Web export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/web_nothreads_release.zip"
      - name: Import and validate Godot project
        run: |
          set -euo pipefail
          godot --headless --path metro2 --editor --import --quit
      - name: Export HTML5 preview
        run: |
          set -euo pipefail
          mkdir -p metro2/build/web
          godot --headless --path metro2 --export-release Web build/web/index.html
          test -s metro2/build/web/index.html
          test -s metro2/build/web/index.wasm
          test -s metro2/build/web/index.pck
          touch metro2/build/web/.nojekyll
      - name: Export isolated Godot 3D probe
        run: |
          set -euo pipefail
          cp metro2/project.godot metro2/project.godot.original
          sed -i 's|^run/main_scene=.*|run/main_scene="res://scenes/web_render_probe.tscn"|' metro2/project.godot
          mkdir -p metro2/build/probe
          godot --headless --path metro2 --export-release Web build/probe/index.html
          mv metro2/project.godot.original metro2/project.godot
          test -s metro2/build/probe/index.pck
          touch metro2/build/probe/.nojekyll
      - name: Export lightweight playable tunnel
        run: |
          set -euo pipefail
          cp metro2/project.godot metro2/project.godot.original
          sed -i 's|^run/main_scene=.*|run/main_scene="res://scenes/lite_playable.tscn"|' metro2/project.godot
          mkdir -p metro2/build/lite
          godot --headless --path metro2 --export-release Web build/lite/index.html
          mv metro2/project.godot.original metro2/project.godot
          test -s metro2/build/lite/index.pck
      - name: Export original V106 single wagon preview
        run: |
          set -euo pipefail
          cp metro2/project.godot metro2/project.godot.original
          sed -i 's|^run/main_scene=.*|run/main_scene="res://scenes/v106_single_car_playable.tscn"|' metro2/project.godot
          mkdir -p metro2/build/v106-one
          godot --headless --path metro2 --export-release Web build/v106-one/index.html
          mv metro2/project.godot.original metro2/project.godot
          test -s metro2/build/v106-one/index.pck
      - name: Export isolated V106 rails preview
        run: |
          set -euo pipefail
          cp metro2/project.godot metro2/project.godot.original
          sed -i 's|^run/main_scene=.*|run/main_scene="res://scenes/v106_rails_preview.tscn"|' metro2/project.godot
          mkdir -p metro2/build/v106-rails
          godot --headless --path metro2 --export-release Web build/v106-rails/index.html
          mv metro2/project.godot.original metro2/project.godot
          test -s metro2/build/v106-rails/index.pck
      - name: Export isolated tunnel artifact fix preview
        run: |
          set -euo pipefail
          cp metro2/project.godot metro2/project.godot.original
          sed -i 's|^run/main_scene=.*|run/main_scene="res://scenes/v106_tunnel_fix_preview.tscn"|' metro2/project.godot
          mkdir -p metro2/build/v106-tunnel-fix
          godot --headless --path metro2 --export-release Web build/v106-tunnel-fix/index.html
          mv metro2/project.godot.original metro2/project.godot
          test -s metro2/build/v106-tunnel-fix/index.pck
      - name: Export isolated static tunnel lighting preview
        run: |
          set -euo pipefail
          cp metro2/project.godot metro2/project.godot.original
          sed -i 's|^run/main_scene=.*|run/main_scene="res://scenes/v106_static_lights_preview.tscn"|' metro2/project.godot
          mkdir -p metro2/build/v106-static-lights
          godot --headless --path metro2 --export-release Web build/v106-static-lights/index.html
          mv metro2/project.godot.original metro2/project.godot
          test -s metro2/build/v106-static-lights/index.pck
      - name: Export V106 two cars and sleepers
        run: |
          set -euo pipefail
          cp metro2/project.godot metro2/project.godot.original
          sed -i 's|^run/main_scene=.*|run/main_scene="res://scenes/v106_two_cars_sleepers.tscn"|' metro2/project.godot
          mkdir -p metro2/build/v106-two-cars
          godot --headless --path metro2 --export-release Web build/v106-two-cars/index.html
          mv metro2/project.godot.original metro2/project.godot
          test -s metro2/build/v106-two-cars/index.pck
      - name: Export V106 three cars and extended tunnel
        run: |
          set -euo pipefail
          cp metro2/project.godot metro2/project.godot.original
          sed -i 's|^run/main_scene=.*|run/main_scene="res://scenes/v106_three_cars_preview.tscn"|' metro2/project.godot
          mkdir -p metro2/build/v106-three-cars
          godot --headless --path metro2 --export-release Web build/v106-three-cars/index.html
          mv metro2/project.godot.original metro2/project.godot
          test -s metro2/build/v106-three-cars/index.pck
      - name: Export four-car preview at a fresh URL
        run: |
          set -euo pipefail
          cp metro2/project.godot metro2/project.godot.original
          sed -i 's|^run/main_scene=.*|run/main_scene="res://scenes/v106_four_cars_preview.tscn"|' metro2/project.godot
          mkdir -p metro2/build/v106-four-cars
          godot --headless --path metro2 --export-release Web build/v106-four-cars/index.html
          mv metro2/project.godot.original metro2/project.godot
          test -s metro2/build/v106-four-cars/index.pck
      - name: Export isolated car04 diagnostic
        run: |
          set -euo pipefail
          cp metro2/project.godot metro2/project.godot.original
          sed -i 's|^run/main_scene=.*|run/main_scene="res://scenes/v106_car04_only.tscn"|' metro2/project.godot
          mkdir -p metro2/build/v106-car04-only
          godot --headless --path metro2 --export-release Web build/v106-car04-only/index.html
          mv metro2/project.godot.original metro2/project.godot
          test -s metro2/build/v106-car04-only/index.pck
      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: metro2-browser-preview
          path: metro2/build/web/
          if-no-files-found: error

      - name: Checkout live gh-pages branch separately
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
          fetch-depth: 0
          path: published-site
      - name: Publish Godot under /metro2 without changing old website
        shell: bash
        run: |
          set -euo pipefail
          test -f published-site/index.html
          test -f metro2/build/web/index.html
          find metro2/build/web -type f -size +95M -print -quit | grep -q . && { echo "Web export has a file >95MB; refusing GitHub push"; exit 1; } || true
          mkdir -p published-site/metro2
          cp -a metro2/build/web/. published-site/metro2/
          mkdir -p published-site/metro2/probe
          cp -a metro2/build/probe/. published-site/metro2/probe/
          mkdir -p published-site/metro2/lite
          cp -a metro2/build/lite/. published-site/metro2/lite/
          mkdir -p published-site/metro2/v106-one
          cp -a metro2/build/v106-one/. published-site/metro2/v106-one/
          mkdir -p published-site/metro2/v106-rails
          cp -a metro2/build/v106-rails/. published-site/metro2/v106-rails/
          mkdir -p published-site/metro2/v106-tunnel-fix
          cp -a metro2/build/v106-tunnel-fix/. published-site/metro2/v106-tunnel-fix/
          mkdir -p published-site/metro2/v106-static-lights
          cp -a metro2/build/v106-static-lights/. published-site/metro2/v106-static-lights/
          mkdir -p published-site/metro2/v106-two-cars
          cp -a metro2/build/v106-two-cars/. published-site/metro2/v106-two-cars/
          mkdir -p published-site/metro2/v106-three-cars
          cp -a metro2/build/v106-three-cars/. published-site/metro2/v106-three-cars/
          mkdir -p published-site/metro2/v106-car04-only
          cp -a metro2/build/v106-car04-only/. published-site/metro2/v106-car04-only/
          mkdir -p published-site/metro2/v106-four-cars
          cp -a metro2/build/v106-four-cars/. published-site/metro2/v106-four-cars/
          cd published-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- metro2
          if git diff --cached --quiet; then
            echo "Godot preview already published"
            exit 0
          fi
          git commit -m "Publish Godot Metro 2 under /metro2 on gh-pages (preserve legacy root)"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
