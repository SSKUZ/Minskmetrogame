name: Publish 3D wagon preview
on:
  workflow_dispatch:
  push:
    branches: [testing]
    paths:
      - 'preview/wagon.html'
      - '.github/workflows/wagon-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wagon-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/wagon.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
