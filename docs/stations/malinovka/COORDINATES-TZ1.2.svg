e="14">Старые рельсы: верх +0,100 → 0; поезд +0,220. Относительное исправление: +0,320.</text><text class="sub" x="32" y="636" font-family="DejaVu Sans" fill="#193447" font-size="17" font-weight="bold">Зазоры на уровне новой платформы: разные измерительные поверхности</text><text class="label" x="32" y="664" font-family="DejaVu Sans" fill="#193447" font-size="14">|X края| 1,370 − |X кузова| 1,337 = 0,033 м</text><text class="label" x="32" y="688" font-family="DejaVu Sans" fill="#193447" font-size="14">|X края| 1,370 − |X порога| 1,3005 = 0,0695 м</text><text class="label" x="32" y="712" font-family="DejaVu Sans" fill="#193447" font-size="14">Расчётный боковой бюджет ±0,010 оставляет 0,023 м; после допуска сравнения 0,001 — 0,022 м.</text><text class="small" x="32" y="746" font-family="DejaVu Sans" fill="#193447" font-size="12">Проверена полоса до Yc=1,1855 и пять положений дверей; кривые, крен и подвеска этим не подтверждены.</text><text class="small" x="32" y="768" font-family="DejaVu Sans" fill="#193447" font-size="12">33 мм выбраны для совместимости с неизменным asset и запаса; это проектное предложение для игры.</text><text class="small" x="32" y="804" font-family="DejaVu Sans" fill="#193447" font-size="12">Источник: CPU BufferGeometry v106 @ 9a1a17bd… · реальные размеры станции и нормативные зазоры не установлены.</text></g></svg>