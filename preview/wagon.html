 group.add(rod);return rod;

// Camera height is measured from the passenger floor F, not world origin.
let cameraMode='outside';
function setCamera(mode){
 cameraMode=mode;
 if(mode==='front'){
  camera.position.set(0,F+1.65,cabFront-7.2);

 }else if(mode==='salon'){

 }else if(mode==='driver'){

  camera.position.set(-.38,F+1.23,-8.55);

 }else{

}
