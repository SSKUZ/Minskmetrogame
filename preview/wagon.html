function stripeSegment(side,z1,y1,z2,y2,width=.105,onDoor=false){
 // Painted stripe: flat quadrilateral on the actual exterior sheet surface.
 // Preserve the exact z/y endpoints and width of v12; no raised geometry.

for(const side of [-1,1]){

  if(doors.some(d=>Math.abs(d-mid)<.01))continue;
