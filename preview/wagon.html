<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вагон 81-717/714 — геометрия</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#141b25;color:white;font:14px system-ui}#info{position:absolute;top:8px;left:8px;background:#101923d9;padding:12px;border-radius:8px;max-width:340px;pointer-events:none}button{position:absolute;bottom:14px;left:14px;padding:12px;border:0;border-radius:8px;background:#f1ca55;color:#111;font-weight:700}</style></head><body><div id="info"><b>81-717/714 · Головной вагон 81-717 · v10</b><br>Кузов 19,206 × 2,670 м · 4 двери на сторону · 8 проёмов всего<br>Поворот: пальцем · масштаб: двумя пальцами · обзор: снаружи/внутри<br><small>Версия v10: белая полоса с одним V-образным изгибом на каждой двери, без крестов.</small></div><div id="status" style="position:absolute;right:10px;bottom:14px;max-width:220px;background:#16232de8;padding:9px;border-radius:8px">Загрузка 3D…</div><button id="view">Внутри вагона</button><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color(0x141b25);
const camera=new T.PerspectiveCamera(58,innerWidth/innerHeight,.03,150);camera.position.set(8,5,-14);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x303a49,2.3));const sun=new T.DirectionalLight(0xffffff,2.5);sun.position.set(6,15,9);scene.add(sun);
const ctl=new OrbitControls(camera,renderer.domElement);ctl.target.set(0,1.8,0);ctl.enableDamping=true;ctl.minDistance=.5;ctl.maxDistance=42;
const mat=(color,metalness=0)=>new T.MeshStandardMaterial({color,metalness,roughness:.65,side:T.DoubleSide});
const wall=mat(0x235273),roof=mat(0x2a5878),floor=mat(0x55585a),metal=mat(0x8d9b9d,.65),seat=mat(0x77716b),glass=new T.MeshStandardMaterial({color:0x8cb2c5,transparent:true,opacity:.30,side:T.DoubleSide,depthWrite:false});
const group=new T.Group();scene.add(group);const dark=mat(0x28323a);const cream=mat(0xe5ded0),black=mat(0x12171b),light=mat(0xfff4c7),redLamp=mat(0xb52228),interior=mat(0xd6d0c1);
function box(w,h,d,x,y,z,m){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);group.add(o);return o}

// Rounded profile lies in the (longitudinal z, vertical y) plane, normal to x.
function roundedShape(w,h,r){
 const q=new T.Shape(),a=-w/2,b=-h/2,R=Math.min(r,w/2-.001,h/2-.001);
 q.moveTo(a+R,b);q.lineTo(a+w-R,b);q.quadraticCurveTo(a+w,b,a+w,b+R);
 q.lineTo(a+w,b+h-R);q.quadraticCurveTo(a+w,b+h,a+w-R,b+h);
 q.lineTo(a+R,b+h);q.quadraticCurveTo(a,b+h,a,b+h-R);
 q.lineTo(a,b+R);q.quadraticCurveTo(a,b,a+R,b);return q;
}
function roundedPanel(w,h,r,x,y,z,m){
 const mesh=new T.Mesh(new T.ShapeGeometry(roundedShape(w,h,r),12),m);
 mesh.rotation.y=Math.PI/2;mesh.position.set(x,y,z);group.add(mesh);return mesh;
}
function roundedOpening(w,h,r,x,y,z,side){
 // Fill the four square corners with opaque body metal so the cut-out is rounded.
 const outer=new T.Shape();outer.moveTo(-w/2,-h/2);outer.lineTo(w/2,-h/2);outer.lineTo(w/2,h/2);outer.lineTo(-w/2,h/2);outer.closePath();
 const hole=new T.Path();const points=roundedShape(w,h,r).getPoints(12);
 for(let i=points.length-1;i>=0;i--){const p=points[i];if(i===points.length-1)hole.moveTo(p.x,p.y);else hole.lineTo(p.x,p.y)}hole.closePath();outer.holes.push(hole);
 const patch=new T.Mesh(new T.ShapeGeometry(outer,12),wall);patch.rotation.y=Math.PI/2;patch.position.set(x+side*.004,y,z);group.add(patch);
 roundedPanel(w-.045,h-.045,r-.012,x+side*.055,y,z,glass);
 const pts=roundedShape(w,h,r).getPoints(12);
 const curve=new T.CatmullRomCurve3(pts.map(p=>new T.Vector3(x+side*.07,y+p.y,z-p.x)),true,'centripetal');
 group.add(new T.Mesh(new T.TubeGeometry(curve,96,.022,6,true),metal));
}

const L=19.206,W=2.670,half=W/2,F=.95,top=3.47,doorWidth=1.38,doorHeight=2.08;
box(W-.12,.12,L-.08,0,F-.06,0,floor);
for(const x of [-1,1]){box(.075,.20,L-.12,x*(half-.055),F-.08,0,metal);box(.08,.53,L-.08,x*(half-.04),F+.265,0,wall);box(.08,.30,L-.08,x*(half-.04),top-.15,0,wall)}
// Four identical openings per side. Door modules and window bays occupy disjoint intervals.
const doors=[-6.65,-2.2,2.2,6.65],ends=[-L/2,...doors.flatMap(z=>[z-doorWidth/2,z+doorWidth/2]),L/2].sort((a,b)=>a-b);
// Side body is continuous sheet metal with rectangular cut-outs for windows and doors.
// Each window bay has opaque piers, lower waist panel, upper header and a framed opening.
for(const side of [-1,1]){
 const x=side*(half-.04);
 for(let i=0;i<ends.length-1;i++){
  const a=ends[i],b=ends[i+1],mid=(a+b)/2,len=b-a;
  if(len<.1)continue;
  // Door apertures are not filled with glass or wall.
  if(doors.some(z=>Math.abs(z-mid)<.01&&Math.abs(len-doorWidth)<.01))continue;
  // Separate exterior access door to the driver's cab, on each side of the head car.
  if(mid < -7.5){
   const cabDoorZ=-8.52, cabDoorW=.74, cabDoorH=1.94;
   // Full-height opaque sidewall, with a clearly outlined cab door in its plane.
   box(.085,top-.28-F,len,x,(top-.28+F)/2,mid,wall);
   const outline=mat(0x11191e,.35);
   roundedPanel(cabDoorW+.07,cabDoorH+.07,.13,x+side*.055,F+cabDoorH/2,cabDoorZ,outline);
   roundedPanel(cabDoorW,cabDoorH,.12,x+side*.073,F+cabDoorH/2,cabDoorZ,wall);
   // Tall glazed window in upper half of the driver's access door.
   roundedPanel(.48,.69,.085,x+side*.092,F+1.47,cabDoorZ,glass);
   // Perimeter of the glazed insert.
   for(const yy of [F+1.125,F+1.815])box(.028,.023,.51,x+side*.104,yy,cabDoorZ,metal);
   for(const zz of [cabDoorZ-.24,cabDoorZ+.24])box(.028,.70,.023,x+side*.104,F+1.47,zz,metal);
   continue;
  }
  const windowWidth=Math.min(1.67,Math.max(0,len-.38));
  const pier=(len-windowWidth)/2;
  const sill=F+1.04,header=F+2.00;
  // Solid sidewall from the under-window waist to the roof, uninterrupted at joints.
  box(.085,sill-F,len,x,(sill+F)/2,mid,wall);
  box(.085,top-.28-header,len,x,(header+top-.28)/2,mid,wall);
  for(const e of [-1,1])box(.085,header-sill,pier,x,(header+sill)/2,mid+e*(windowWidth+pier)/2,wall);
  // Actual window glass only inside the structural cutout, not the full wall bay.
  if(windowWidth>.30)roundedOpening(windowWidth,header-sill,.16,x,(header+sill)/2,mid,side);
 }
 for(const dz of doors){
  // Metal jambs are structural parts of the same sidewall.
  box(.10,.10,doorWidth+.09,x,F+doorHeight+.04,dz,metal);
  for(const e of [-1,1])box(.09,doorHeight,.09,x,F+doorHeight/2,dz+e*doorWidth/2,metal);
  box(.10,.025,doorWidth,x,F+.015,dz,metal);
  // Each closed sliding leaf is opaque metal, with only a small window insert.
  for(const halfDoor of [-1,1]){
   const leafZ=dz+halfDoor*doorWidth/4;
   box(.085,doorHeight-.19,doorWidth/2-.045,x,F+(doorHeight-.19)/2,leafZ,wall);
   // Rounded upper outside corner on the leaf, matching the historic sliding doors.
   roundedPanel(doorWidth/2-.045,.24,.105,x+side*.051,F+doorHeight-.21,leafZ,wall);
   roundedPanel(.43,.78,.09,x+side*.055,F+1.49,leafZ,glass);
   
   

  }
 }
}

// Reference livery: the horizontal white belt runs just below the passenger windows.
// At EACH doorway it goes from the left body panel to the INNER LOWER CORNER
// of the left door leaf, turns once, and returns to the right body panel.
// This is a single angular V / chevron, NOT an X and NOT two separate motifs.
function stripeSegment(side,z1,y1,z2,y2,width=.105){
 const x=side*(half+.105),dz=z2-z1,dy=y2-y1;
 const mesh=new T.Mesh(new T.BoxGeometry(.020,width,Math.hypot(dz,dy)),cream);
 mesh.rotation.x=-Math.atan2(dy,dz);
 mesh.position.set(x,(y1+y2)/2,(z1+z2)/2);group.add(mesh);
}
for(const side of [-1,1]){
 const beltY=F+1.07,tipY=F+.19,outer=doorWidth/2-.02;
 // Subtle horizontal body corrugations, excluding door leaves.
 for(let z=-9.23;z<9.15;z+=.53){
  if(doors.some(d=>Math.abs(d-z)<doorWidth/2+.06))continue;
  box(.018,.016,.45,side*(half+.024),F+.40,z,metal);
  box(.018,.014,.45,side*(half+.024),F+.64,z,metal);
 }
 // A single continuous band with an angular detour at every passenger door:
 // left jamb -> one bottom corner at the meeting of leaves -> right jamb.
 const cuts=[-L/2,...doors.flatMap(d=>[d-doorWidth/2,d+doorWidth/2]),L/2].sort((aa,bb)=>aa-bb);
 for(let i=0;i<cuts.length-1;i++){
  const aa=cuts[i],bb=cuts[i+1],mid=(aa+bb)/2;
  if(doors.some(d=>Math.abs(d-mid)<.01))continue;
  box(.020,.105,bb-aa,side*(half+.105),beltY,mid,cream);
 }
 for(const d of doors){
  stripeSegment(side,d-outer,beltY,d,tipY);
  stripeSegment(side,d,tipY,d+outer,beltY);
 }
}
// Extruded roof profile in a single metric cross section.
const profile=[[-half,top-.33],[-1.22,top-.10],[-1.02,top+.06],[-.78,top+.13],[.78,top+.13],[1.02,top+.06],[1.22,top-.10],[half,top-.33]];
const verts=[],idx=[];for(const [x,y] of profile)verts.push(x,y,-L/2,x,y,L/2);
for(let i=0;i<profile.length-1;i++){const a=2*i;idx.push(a,a+1,a+2,a+1,a+3,a+2)}
const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();group.add(new T.Mesh(geo,roof));
// Longitudinal benches between doors, with an unobstructed central aisle.
const sections=[[-9.30,-7.75],[-6.05,-3.15],[-1.45,1.45],[3.15,6.05],[7.75,9.30]];
for(const side of [-1,1])for(const [a,b] of sections){
 const len=b-a,z=(a+b)/2;
 box(.44,.12,len-.12,side*.99,F+.47,z,seat);
 box(.10,.63,len-.12,side*1.23,F+.78,z,seat);
 box(.38,.24,len-.12,side*1.03,F+.24,z,metal);
 for(const zz of [a+.08,b-.08]){
  box(.035,1.90,.035,side*.72,F+.96,zz,metal);
  box(.035,.42,.035,side*.72,F+.26,zz,metal);
 }
}
for(const side of [-1,1])box(.035,.035,L-.30,side*.78,top-.38,0,metal);
for(let z=-8.3;z<=8.3;z+=2.1)box(.60,.025,1.4,0,top+.015,z,mat(0xfff7d9));
// HEAD CAR: front cab at negative Z, distinct from intermediate carriage.
const cabFront=-L/2+.07;
box(W-.10,.76,.12,0,F+.38,cabFront,wall);
box(W-.10,.44,.12,0,top-.54,cabFront,wall);
for(const xx of [-1.13,1.13])box(.24,1.42,.12,xx,F+1.47,cabFront,wall);
// Rebuilt flat dark front mask and tall rounded windscreens in one plane.
box(W-.23,1.45,.08,0,F+1.60,cabFront-.115,black);
const frontGlass=new T.MeshStandardMaterial({color:0x426879,transparent:true,opacity:.53,metalness:.12,roughness:.20,side:T.DoubleSide});
for(const [xx,ww] of [[0,1.19],[-.91,.42],[.91,.42]]){
 const p=new T.Mesh(new T.ShapeGeometry(roundedShape(ww,1.23,.15),12),frontGlass);
 p.position.set(xx,F+1.66,cabFront-.172);group.add(p);
 const pts=roundedShape(ww,1.23,.15).getPoints(12);
 const curve=new T.CatmullRomCurve3(pts.map(q=>new T.Vector3(xx+q.x,F+1.66+q.y,cabFront-.18)),true);
 group.add(new T.Mesh(new T.TubeGeometry(curve,96,.025,6,true),metal));
}
// Destination panel, two upper red markers and four lower white lamps.
box(.92,.23,.035,0,F+1.05,cabFront-.18,black);
for(const xx of [-.99,.99]){
 const marker=new T.Mesh(new T.CylinderGeometry(.115,.115,.04,24),redLamp);
 marker.rotation.x=Math.PI/2;marker.position.set(xx,F+2.35,cabFront-.20);group.add(marker);
}
for(const xx of [-.98,-.33,.33,.98]){
 const lamp=new T.Mesh(new T.CylinderGeometry(.12,.12,.045,24),light);
 lamp.rotation.x=Math.PI/2;lamp.position.set(xx,F+.65,cabFront-.20);group.add(lamp);
}
box(1.6,.12,.10,0,F+.38,cabFront-.20,wall);
box(.26,.20,.38,0,F+.18,cabFront-.36,metal);
// Cab bulkhead and control console, behind the front windscreen.
const cabRear=-7.68;
box(W-.18,1.98,.09,0,F+.99,cabRear,interior);
box(.82,1.82,.055,.36,F+.92,cabRear-.058,metal);
box(1.30,.70,.65,-.45,F+.87,-8.84,dark);
box(1.15,.07,.48,-.45,F+1.28,-8.84,metal);
box(.48,.15,.43,.63,F+.48,-8.66,seat);
box(.14,.65,.14,.63,F+.19,-8.66,metal);
// Opposite end is the inter-car bulkhead.
box(W-.08,2.2,.09,0,F+1.1,L/2-.055,interior);
box(.72,1.83,.10,0,F+.93,L/2-.12,metal);
// Underframe and simplified bogies at measured-looking locations (not yet factory verified).
box(1.78,.18,L-1.0,0,F-.27,0,dark);
for(const z of [-6.50,6.50]){
 box(1.94,.18,2.22,0,F-.53,z,metal);
 for(const zz of [z-.85,z+.85])for(const xx of [-.90,.90]){
  const wheel=new T.Mesh(new T.CylinderGeometry(.39,.39,.12,20),dark);
  wheel.rotation.z=Math.PI/2;wheel.position.set(xx,F-.78,zz);group.add(wheel);
 }
}
const grid=new T.GridHelper(28,28,0x607080,0x394655);grid.position.y=.005;scene.add(grid);
let inside=false;document.getElementById('view').onclick=()=>{inside=!inside;camera.position.set(inside?0:8,inside?2.5:5,inside?0:-14);ctl.target.set(0,inside?2:1.8,inside?-5:0);document.getElementById('view').textContent=inside?'Снаружи вагона':'Внутри вагона'};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('status').textContent='3D загружено';function loop(){requestAnimationFrame(loop);ctl.update();renderer.render(scene,camera)}loop();
</script><script>setTimeout(()=>{const s=document.getElementById('status');if(s&&s.textContent==='Загрузка 3D…')s.textContent='Ошибка загрузки 3D. Откройте страницу в Chrome с включённым JavaScript.'},10000)</script></body></html>
