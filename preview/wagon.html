}

function projectedFeature(object){
 const bounds=new T.Box3();
 for(const mesh of Array.isArray(object)?object:[object])bounds.union(new T.Box3().setFromObject(mesh));
 const points=[];
 for(const x of [bounds.min.x,bounds.max.x])for(const y of [bounds.min.y,bounds.max.y])for(const z of [bounds.min.z,bounds.max.z]){
  const p=new T.Vector3(x,y,z).project(camera);points.push([(p.x+1)*innerWidth/2,(1-p.y)*innerHeight/2]);
 }
 return {x:Math.min(...points.map(p=>p[0])),y:Math.min(...points.map(p=>p[1])),width:Math.max(...points.map(p=>p[0]))-Math.min(...points.map(p=>p[0])),height:Math.max(...points.map(p=>p[1]))-Math.min(...points.map(p=>p[1]))};
}

  const found=ray.intersectObjects(meshes,false);
  return details?found.map(h=>({geometry:h.object.geometry.type,position:h.object.position.toArray(),point:h.point.toArray(),material:h.object.material.color?.getHexString()})):found.length;
 };
