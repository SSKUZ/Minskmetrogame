function setCamera(mode){
 cameraMode=mode;
 if(mode==='salon'){
  // Ceiling-mounted diagonal view, ~2.0 m above floor, above passengers.
  camera.position.set(.75,F+2.0,6.7);
  ctl.target.set(0,F+1.05,-2.2);
 }else if(mode==='driver'){
  // Seated driver's eye level, facing the front of the head car (-Z).
  camera.position.set(-.38,F+1.23,-8.55);
  ctl.target.set(-.38,F+1.18,-11.8);
 }else{
  camera.position.set(8,5,-14);ctl.target.set(0,1.8,0);
 }
 ctl.update();
 document.getElementById('view').textContent=mode==='salon'?'Снаружи вагона':'Камера салона';
 document.getElementById('driver').textContent=mode==='driver'?'Снаружи вагона':'Камера машиниста';
}
document.getElementById('view').onclick=()=>setCamera(cameraMode==='salon'?'outside':'salon');
document.getElementById('driver').onclick=()=>setCamera(cameraMode==='driver'?'outside':'driver');
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('status').textContent='3D загружено';function loop(){requestAnimationFrame(loop);ctl.update();renderer.render(scene,camera)}loop();
</script><script>setTimeout(()=>{const s=document.getElementById('status');if(s&&s.textContent==='Загрузка 3D…')s.textContent='Ошибка загрузки 3D. Откройте страницу в Chrome с включённым JavaScript.'},10000)</script></body></html>
