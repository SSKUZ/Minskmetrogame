<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Минское метро — Машинист Захар</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05080b;color:#eaf3f6;font:600 14px system-ui}#view{position:absolute;inset:0;width:100%;height:100%;display:block}#glass{position:absolute;left:4%;top:4%;width:92%;height:59%;border:10px solid #151e25;border-radius:24px 24px 10px 10px;box-shadow:inset 0 0 25px #000,0 0 0 4px #3a4752;pointer-events:none}#pillar{position:absolute;top:3%;left:50%;height:62%;width:10px;background:linear-gradient(90deg,#0b1016,#52606a,#111820);pointer-events:none}#console{position:absolute;bottom:0;width:100%;height:37%;background:linear-gradient(155deg,#50606b,#1c2933 30%,#0c151c 85%);border-top:9px solid #73818a;box-shadow:0 -12px 25px #0009;display:flex;flex-direction:column;padding:7px 10px max(12px,env(safe-area-inset-bottom));gap:7px}#title{text-align:center;color:#86ff9c;background:#091b15;border:2px solid #527b65;box-shadow:inset 0 0 12px #155c36;text-shadow:0 0 10px #29ff6e;letter-spacing:1.5px;border-radius:5px;padding:5px;font-size:clamp(12px,3.3vw,20px)}#meters{display:flex;align-items:center;justify-content:space-around;gap:5px}#dial{width:76px;height:76px;flex:none;border-radius:50%;background:radial-gradient(circle,#142a34 45%,#04080d 46%,#5b6d75 54%,#0c1419 61%);border:2px solid #8ca0aa;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#92eaff;font-size:23px;text-shadow:0 0 8px #3ccfff}#dial small{font-size:10px;color:#c9dce4}#readout{flex:1;text-align:center;background:#101d26;border:2px solid #556a76;border-radius:7px;padding:7px 2px;line-height:1.6;font-size:clamp(11px,3vw,16px)}#message{color:#f9d879}#buttons{display:flex;gap:7px;flex:1;min-height:50px}button{flex:1;min-width:0;background:linear-gradient(#3f6879,#1b3847);color:white;border:2px solid #94a9b3;border-radius:9px;font-size:clamp(12px,3.5vw,19px);font-weight:800;touch-action:none}button:active{filter:brightness(1.4)}#brake{background:linear-gradient(#b34b42,#5d2528)}#doors{background:linear-gradient(#4c966f,#1e513c)}#start{position:absolute;inset:0;z-index:5;background:#09131de9;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:20px;padding:30px}#start h1{font-size:clamp(25px,8vw,48px);margin:0}#start button{flex:none;padding:17px 45px;background:#2c8e63}#start p{font-weight:400;max-width:440px}
@media(max-height:680px){#console{height:42%}#glass{height:54%}#pillar{height:57%}#dial{width:60px;height:60px;font-size:19px}#title{padding:2px}#console{gap:3px}}
</style></head><body><canvas id="view"></canvas><div id="glass"></div><div id="pillar"></div><div id="console"><div id="title">МАШИНИСТ КУЗНЕЦОВ ЗАХАР</div><div id="meters"><div id="dial"><span id="speed">0</span><small>км/ч</small></div><div id="readout"><div id="next">Плошча Перамогі · 850 м</div><div id="message">Подай тягу для отправления</div><div id="people">Пассажиры: 0</div></div></div><div id="buttons"><button id="brake">◀ ТОРМОЗ</button><button id="gas">ТЯГА ▶</button><button id="doors">🚪 ДВЕРИ</button></div></div><div id="start"><h1>🚇 МИНСКОЕ МЕТРО</h1><div style="color:#88ffa5;font-size:20px">Машинист Кузнецов Захар</div><p>Управляй поездом из кабины. Разгоняйся, тормози у платформы и открывай двери для пассажиров. Звук включится после запуска.</p><button id="play">НАЧАТЬ РЕЙС</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const canvas=document.getElementById('view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080e15);scene.fog=new THREE.Fog(0x080e15,35,175);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,220);camera.position.set(0,2.8,6);camera.lookAt(0,2.3,-30);
scene.add(new THREE.HemisphereLight(0xa9c6de,0x11121a,1.1));const light=new THREE.PointLight(0xb3d9ff,18,42);light.position.set(0,4,-12);scene.add(light);
const mat=(c,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.75,metalness:metal});const wall=mat(0x34414b),floor=mat(0x242b32),steel=mat(0xa1a8a8,.7),wood=mat(0x655b4c),yellow=new THREE.MeshBasicMaterial({color:0xffd851}),glow=new THREE.MeshBasicMaterial({color:0xc7ecff});
const world=new THREE.Group();scene.add(world);
function box(parent,w,h,d,x,y,z,m){const a=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);a.position.set(x,y,z);parent.add(a);return a}
const chunks=[];function chunk(z){const g=new THREE.Group();g.position.z=z;world.add(g);box(g,12,.5,34,0,-.3,-15,floor);box(g,.5,8,34,-6,3.8,-15,wall);box(g,.5,8,34,6,3.8,-15,wall);box(g,12,.5,34,0,7.8,-15,wall);
for(let i=0;i<2;i++){box(g,.12,.15,34,(i?1:-1)*1.1,.12,-15,steel);box(g,.1,.1,34,(i?1:-1)*2.6,.05,-15,steel)}
for(let j=0;j<12;j++){const zz=-j*2.8;box(g,5,.17,.3,0,0,zz,wood)}
for(let j=0;j<3;j++){const zz=-5-j*11;box(g,2.8,.08,1,0,7.45,zz,glow);box(g,.3,1.7,.15,-5.7,4,zz,glow);box(g,.3,1.7,.15,5.7,4,zz,glow)}
chunks.push(g)}for(let i=0;i<7;i++)chunk(-i*34);
const station=new THREE.Group();world.add(station);
const platform=mat(0x8c9295),edge=mat(0xf3c42b),columns=mat(0xd7d3c5),sign=mat(0x185f86);
box(station,3,.8,100,4.5,.35,-50,platform);box(station,.2,.06,100,2.9,.8,-50,edge);
for(let i=0;i<9;i++){let z=-i*11;box(station,.8,6,.8,5.4,3.4,z,columns);box(station,1.9,.8,.12,5.35,5.5,z,sign);box(station,2.4,.1,2.2,4.5,7,z,glow)}
const label=document.createElement('canvas');label.width=768;label.height=128;const lc=label.getContext('2d');const texture=new THREE.CanvasTexture(label);const board=new THREE.Mesh(new THREE.PlaneGeometry(4.5,.75),new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide}));board.position.set(4.65,5.2,-15);board.rotation.y=-Math.PI/2;station.add(board);
const names=['Плошча Перамогі','Кастрычніцкая','Плошча Леніна','Інстытут культуры'];let index=0,dist=850,speed=0,passengers=0,gas=false,brake=false,open=false,active=false,elapsed=0,previous=performance.now();
function stationText(){lc.fillStyle='#145c82';lc.fillRect(0,0,768,128);lc.fillStyle='white';lc.font='bold 54px Arial';lc.textAlign='center';lc.fillText(names[index%names.length],384,80);texture.needsUpdate=true}stationText();
function speak(t,lang='ru-RU'){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const a=new SpeechSynthesisUtterance(t);a.lang=lang;a.rate=.9;speechSynthesis.speak(a)}
function bind(id,fn1,fn2){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);fn1()});['pointerup','pointercancel','lostpointercapture'].forEach(k=>b.addEventListener(k,fn2))}
bind('gas',()=>{if(!open)gas=true},()=>gas=false);bind('brake',()=>brake=true,()=>brake=false);
const message=document.getElementById('message');document.getElementById('doors').onclick=()=>{if(speed>1){message.textContent='Останови поезд!';return}if(dist>30||dist< -30){message.textContent='Нужна остановка у платформы';return}if(!open){open=true;gas=false;passengers+=15+Math.floor(Math.random()*25);message.textContent='Посадка пассажиров';speak('Станция '+names[index%names.length]+'. Осторожно, двери открываются.')}else{open=false;index++;dist=850;stationText();message.textContent='Двери закрыты, отправляемся';speak('Осторожно, двери закрываются. Следующая станция '+names[index%names.length]);}};
document.getElementById('play').onclick=()=>{document.getElementById('start').remove();active=true;speak('Добро пожаловать, машинист Кузнецов Захар. Счастливого пути!')};
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-previous)/1000,.05);previous=now;if(active){if(!open){speed=Math.max(0,Math.min(70,speed+(gas?17:-3)*dt-(brake?34:0)*dt));const travel=speed/3.6*dt;dist-=travel;elapsed+=travel;for(const g of chunks){g.position.z+=travel;if(g.position.z>34)g.position.z-=chunks.length*34}station.position.z= -dist+35;if(dist< -65){speed=0;dist=850;message.textContent='Станция пропущена. Повтори попытку!'}}camera.position.x=Math.sin(now*.017)*Math.min(speed/70,1)*.016;light.intensity=15+Math.sin(now*.007)*2}
document.getElementById('speed').textContent=Math.round(speed);document.getElementById('next').textContent=names[index%names.length]+' · '+Math.max(0,Math.round(dist))+' м';document.getElementById('people').textContent='Пассажиры: '+passengers;if(dist<30&&dist> -30&&speed<1&&!open)message.textContent='Точная остановка! Открой двери';renderer.render(scene,camera)}requestAnimationFrame(tick);
</script></body></html>
