const names=['Плошча Перамогі','Кастрычніцкая','Плошча Леніна','Інстытут культуры'];let index=0,dist=850,speed=0,people=0,lever=0,doors=false,playing=false,yaw=0,pitch=0,targetYaw=0,targetPitch=0,last=performance.now();
function paintSign(){sc.fillStyle='#155b87';sc.fillRect(0,0,768,128);sc.fillStyle='white';sc.font='bold 52px Arial';sc.textAlign='center';sc.fillText(names[index%names.length],384,83);texture.needsUpdate=true}paintSign();
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.9;speechSynthesis.speak(u)}
function startRide(){playing=true;speak('Добро пожаловать, машинист Кузнецов Захар!')}window.addEventListener('metro-start',startRide);if(window.metroStarted)startRide();
const track=document.querySelector('#track'),knob=document.querySelector('#knob'),mode=document.querySelector('#mode');
function setLever(e){const r=track.getBoundingClientRect();lever=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2));knob.style.left=(50+lever*50)+'%';mode.textContent=lever>.12?'ТЯГА':lever<-.12?'ТОРМОЗ':'НЕЙТРАЛЬ'}
track.addEventListener('pointerdown',e=>{track.setPointerCapture(e.pointerId);setLever(e)});track.addEventListener('pointermove',e=>{if(e.buttons)setLever(e)});
document.querySelector('#doors').onclick=()=>{if(speed>1){status.textContent='Сначала останови поезд!';return}if(Math.abs(dist)>32){status.textContent='До платформы ещё далеко';return}if(!doors){doors=true;lever=0;knob.style.left='50%';mode.textContent='НЕЙТРАЛЬ';people+=15+Math.floor(Math.random()*25);status.textContent='Пассажиры входят';speak('Станция '+names[index%names.length]+'. Осторожно, двери открываются.')}else{doors=false;index++;dist=850;paintSign();status.textContent='Двери закрыты';speak('Осторожно, двери закрываются. Следующая станция '+names[index%names.length])}};
const stick=document.querySelector('#stick'),joy=document.querySelector('#joystick');function joyMove(e){const r=joy.getBoundingClientRect(),dx=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width*.35))),dy=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height*.35)));stick.style.left=(50+dx*29)+'%';stick.style.top=(50+dy*29)+'%';targetYaw=dx*1.25;targetPitch=-dy*.55}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.buttons)joyMove(e)});joy.addEventListener('pointerup',()=>{stick.style.left='50%';stick.style.top='50%'});

const status=document.querySelector('#status');for(let i=0;i<30;i++){const a=document.createElement('div');a.className='lamp';document.querySelector('#rightPanel').appendChild(a)}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(playing&&!doors){speed=Math.max(0,Math.min(75,speed+(lever>0?lever*18:-3)*dt+(lever<0?lever*40:0)*dt));const move=speed/3.6*dt;dist-=move;for(const g of chunks){g.position.z+=move;if(g.position.z>32)g.position.z-=chunks.length*32}platform.position.z=-dist+30;if(dist< -80){speed=0;dist=850;status.textContent='Станция пропущена!'}}yaw+=(targetYaw-yaw)*Math.min(1,dt*7);pitch+=(targetPitch-pitch)*Math.min(1,dt*7);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;camera.position.x=Math.sin(now*.014)*Math.min(speed/70,1)*.01;document.querySelector('#speed').textContent=Math.round(speed);document.querySelector('#station').textContent=names[index%names.length]+' · '+Math.max(0,Math.round(dist))+' м';document.querySelector('#people').textContent='Пассажиры: '+people;if(Math.abs(dist)<32&&speed<1&&!doors)status.textContent='Точная остановка! Открой двери';renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></body></html>
